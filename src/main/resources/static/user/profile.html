<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin tài khoản | Personal Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      min-height: 100vh;
    }
    .profile-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3 py-2 shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="/blog/home.html">
      <span class="me-2">📝</span> Personal Blog
    </a>
    <a href="/blog/home.html" class="btn btn-outline-light btn-sm">← Về trang chủ</a>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 70px);">
  <div class="card profile-card p-4 p-md-5 my-4" style="width: 450px; max-width: 95%;">

    <div class="text-center mb-4">
      <div class="fs-1 mb-2">👤</div>
      <h3 class="fw-bold text-dark m-0">Thông tin tài khoản</h3>
      <p class="text-muted small">Cập nhật hồ sơ tác giả của bạn</p>
    </div>

    <form onsubmit="event.preventDefault(); updateProfile();">
      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Tên đăng nhập</label>
        <input id="username" type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Mật khẩu</label>
        <input id="password" type="password" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Bút danh hiển thị</label>
        <input id="name" type="text" class="form-control" required>
      </div>

      <div id="message" class="text-center my-3 small fw-medium"></div>

      <button id="btnUpdate" type="submit" class="btn btn-primary w-100">
        Lưu thay đổi
      </button>

      <div class="text-center mt-3">
        <a href="/blog/home.html" class="btn btn-outline-secondary btn-sm px-4">Hủy bỏ</a>
      </div>
    </form>

  </div>
</div>

<script>
  let currentUser = JSON.parse(localStorage.getItem("user"));

  if (!currentUser) {
    alert("Vui lòng đăng nhập để xem thông tin tài khoản!");
    window.location.href = "/index.html";
  } else {
    document.getElementById("name").value = currentUser.name || "";
    document.getElementById("username").value = currentUser.username || "";
    document.getElementById("password").value = currentUser.password || "";
  }

  async function updateProfile() {
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();
    let name = document.getElementById("name").value.trim();
    let message = document.getElementById("message");
    let btn = document.getElementById("btnUpdate");

    message.innerHTML = "";

    if (!username || !password || !name) {
      message.className = "text-danger text-center my-3 small fw-medium";
      message.innerText = "Vui lòng không để trống bất kỳ trường nào!";
      return;
    }

    let user = {
      id: currentUser.id,
      username: username,
      password: password,
      name: name
    };

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang lưu...';

    try {
      let res = await axios.put("/api/users/" + currentUser.id, user);
      localStorage.setItem("user", JSON.stringify(res.data));
      message.className = "text-success text-center my-3 small fw-medium";
      message.innerText = "Cập nhật thành công! Đang chuyển về trang chủ...";
      setTimeout(() => {
        window.location.href = "/blog/home.html";
      }, 1500);
    } catch (e) {
      console.error(e);
      message.className = "text-danger text-center my-3 small fw-medium";
      message.innerText = "Cập nhật thất bại. Vui lòng thử lại!";
      btn.disabled = false;
      btn.innerText = "Lưu thay đổi";
    }
  }
</script>

</body>
</html>
