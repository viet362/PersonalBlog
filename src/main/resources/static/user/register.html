<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản | Personal Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
    }
    .card-register {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-success {
      background-color: #10b981;
      border-color: #10b981;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
    }
    .btn-success:hover {
      background-color: #059669;
      border-color: #059669;
    }
  </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card card-register p-4 p-md-5" style="width: 400px; max-width: 95%;">

    <div class="text-center mb-4">
      <div class="fs-1 mb-2">✨</div>
      <h3 class="fw-bold text-dark m-0">Tạo tài khoản</h3>
      <p class="text-muted small">Trở thành tác giả trên Personal Blog</p>
    </div>

    <form onsubmit="event.preventDefault(); register();">
      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Tên đăng nhập</label>
        <input id="username" type="text" class="form-control" placeholder="Ví dụ: steven.tech" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Mật khẩu</label>
        <input id="password" type="password" class="form-control" placeholder="Mật khẩu bảo mật" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Bút danh / Họ và tên</label>
        <input id="name" type="text" class="form-control" placeholder="Ví dụ: Steven Bui" required>
      </div>

      <button id="btnRegister" type="submit" class="btn btn-success w-100 mt-2">
        Xác nhận đăng ký
      </button>
    </form>

    <div id="regMessage" class="text-center mt-3 small fw-medium"></div>

    <div class="text-center mt-4 pt-3 border-top">
      <span class="text-muted small">Đã có tài khoản?</span>
      <a href="/index.html" class="fw-semibold text-decoration-none text-primary small">Đăng nhập</a>
    </div>

  </div>
</div>

<script>
  async function register() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const name = document.getElementById("name").value.trim();
    const btn = document.getElementById("btnRegister");
    const msg = document.getElementById("regMessage");

    if (!username || !password || !name) {
      msg.className = "text-danger text-center mt-3 small fw-medium";
      msg.innerText = "Vui lòng nhập đầy đủ các trường thông tin!";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng ký...';
    msg.innerText = "";

    try {
      await axios.post("/api/users/register", { username, password, name });
      msg.className = "text-success text-center mt-3 small fw-medium";
      msg.innerText = "Đăng ký thành công! Đang chuyển đến trang đăng nhập...";
      setTimeout(() => {
        window.location.href = "/index.html";
      }, 1500);
    } catch (err) {
      console.error("Lỗi đăng ký:", err);
      msg.className = "text-danger text-center mt-3 small fw-medium";
      msg.innerText = "Đăng ký thất bại! Vui lòng thử lại hoặc chọn username khác.";
      btn.disabled = false;
      btn.innerText = "Xác nhận đăng ký";
    }
  }
</script>

</body>
</html>
