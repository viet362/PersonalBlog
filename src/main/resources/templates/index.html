<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 350px;">

    <h3 class="text-center mb-4">Đăng nhập</h3>

      <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <input id="username" type="text" class="form-control" name="username" placeholder="Username">
      </div>

      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input id="password" type="password" class="form-control" name="password" placeholder="Password">
      </div>

      <button class="btn btn-primary w-100" onclick="login()">Xác nhận</button>

    <div id="error_mes"
         class="text-danger text-center mt-2">
    </div>

    <div class="text-center mt-3">
      <a href="user/register.html">Chưa có tài khoản? Đăng ký.</a>
    </div>

  </div>
</div>

<script>

  function login() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    axios.post("http://localhost:8080/api/users/login", { username, password })
            .then(res => {
              if (res.data && res.data.id) {

                localStorage.setItem("user", JSON.stringify(res.data));

                alert("Đăng nhập thành công! 🎉");
                window.location.href = "/Case_blog/Case_blog.main/templates/blog/home.html";

              } else {
                alert("Đăng nhập thất bại: Tài khoản hoặc mật khẩu không chính xác!");
              }
            })
            .catch(err => {
              console.error("Lỗi đăng nhập:", err);
              alert("Đăng nhập thất bại: Lỗi kết nối đến Server Backend!");
            });
  }

</script>

</body>
</html>
