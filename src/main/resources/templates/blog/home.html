<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style/home.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="home.html">
      <span class="me-2">📝</span> Trang chủ
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="home.html">Tất cả bài viết</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="loadMyBlogs()">Bài viết của tôi</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../user/profile.html">Chỉnh sửa tài khoản</a>
        </li>
      </ul>

      <div class="d-flex gap-2 align-items-center container-search-logout">
        <div class="input-group input-group-sm">
          <select id="searchType" class="form-select bg-light" style="max-width: 110px;">
            <option value="title" selected>Tiêu đề</option>
            <option value="author">Tác giả</option>
            <option value="content">Nội dung</option>
          </select>

          <input id="searchKeyword" class="form-control" type="search" placeholder="Nhập từ khóa..." aria-label="Search">

          <button class="btn btn-primary" type="button" onclick="searchBlog()">
            <i class="fas fa-search"></i> Tìm kiếm
          </button>
        </div>
        <button class="btn btn-danger btn-sm px-3" style="white-space: nowrap" onclick="logout()">Đăng xuất</button>
      </div>

    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row mb-4">
    <div class="col">
      <h2 class="fw-bold text-secondary-heading">Bài viết mới nhất</h2>
      <div class="title-underline"></div>
      <br>
      <button class="btn btn-primary btn-sm px-3" onclick="createBlog()">Viết bài mới</button>
    </div>
  </div>

  <div id="show" class="row g-5">
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<script src="JS/home.js"></script>

<script>

  window.onload = function () {
    axios.get("http://localhost:8080/api/blogs")
            .then(res => render(res.data));
  };

  function searchBlog() {
    // 1. Lấy kiểu tìm kiếm (title, author, hoặc content) và từ khóa người dùng nhập
    const type = document.getElementById("searchType").value;
    const keyword = document.getElementById("searchKeyword").value.trim();

    // Khai báo đường dẫn API mặc định
    let url = "http://localhost:8080/api/blogs";
    let paramsObj = {};

    // 2. Điều hướng API tùy thuộc vào lựa chọn của người dùng
    if (type === "title") {
      url += "/search/title";
      paramsObj = { title: keyword };
    } else if (type === "author") {
      url += "/search/author"; // Hoặc đường dẫn API tìm theo tác giả của bạn
      paramsObj = { name: keyword }; // Tên param tùy thuộc vào Backend nhận (ví dụ: name hoặc author)
    } else if (type === "content") {
      url += "/search/content"; // Đường dẫn API tìm theo nội dung
      paramsObj = { content: keyword };
    }

    // 3. Gửi Request lên Spring Boot Backend
    axios.get(url, { params: paramsObj })
            .then(res => {
              render(res.data); // Dùng lại hàm render() có sẵn của bạn để hiển thị kết quả
            })
            .catch(err => {
              console.error("Lỗi tìm kiếm:", err);
              alert("Đã xảy ra lỗi trong quá trình tìm kiếm!");
            });
  }


  function logout() {
    localStorage.removeItem("user");
    window.location.href = "/Case_blog/Case_blog.main/templates/index.html";
  }

</script>

<script src="JS/detail.js"></script>
<script src="JS/myBlog.js"></script>
<script src="JS/add.js"></script>
<script src="JS/edit.js"></script>

</body>
