spring.application.name=PersonalBlog

# Server Port (Render cấp cổng tự động qua biến PORT)
server.port=${PORT:8080}

# Database Configuration (Aiven MySQL Cloud - Mật khẩu được bảo mật qua biến môi trường)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-22176-buivietbacn01-1ff7.a.aivencloud.com:10055/personal-blog?sslMode=REQUIRED&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình HikariCP tối ưu cho kết nối Database Cloud (Aiven)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false