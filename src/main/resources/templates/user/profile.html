<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 350px;">

        <h3 class="text-center mb-4">Thông tin tài khoản</h3>

        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input id="username" type="text" class="form-control" name="username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input id="password" type="password" class="form-control" name="password" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Bút danh</label>
            <input id="name" type="text" class="form-control" name="name" required>
        </div>

        <div id="message"
             class="text-center mt-2">
        </div>
        <button class="btn btn-success w-100" onclick="updateProfile()">Cập nhật</button>


    </div>
</div>

<script>
    let currentUser =
        JSON.parse(localStorage.getItem("user"));

    document.getElementById("name").value =
        currentUser.name;

    document.getElementById("username").value =
        currentUser.username;

    document.getElementById("password").value =
        currentUser.password;

    async function updateProfile(){

        let username = document.getElementById("username").value.trim();
        let password = document.getElementById("password").value.trim();
        let name = document.getElementById("name").value.trim();

        let message = document.getElementById("message");

        message.innerHTML = "";

        if (username === "" || password === "" || name === "") {
            message.innerHTML =
                "<span style='color:red'>Ô dữ liệu trống</span>";
            return;
        }

        let user = {
            id: currentUser.id,
            username: username,
            password: password,
            name: name
        };

        try{

            let res = await axios.put(
                "http://localhost:8080/api/users/" + currentUser.id,
                user
            );

            localStorage.setItem(
                "user",
                JSON.stringify(res.data)
            );

            message.innerHTML =
                "<span style='color:green'>Cập nhật thành công</span>";
            setTimeout(() => {
                window.location.href = "../blog/home.html";
            }, 2000);

        }catch(e){

            message.innerHTML =
                "<span style='color:red'>Cập nhật thất bại</span>";
        }
    }
</script>

</body>
</html>
