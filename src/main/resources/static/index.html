<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Personal Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
    }
    .card-login {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-primary {
      background-color: #2563eb;
      border-color: #2563eb;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
    }
    .demo-badge {
      font-size: 0.8rem;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
    }
  </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card card-login p-4 p-md-5" style="width: 400px; max-width: 95%;">

    <div class="text-center mb-4">
      <div class="fs-1 mb-2">📝</div>
      <h3 class="fw-bold text-dark m-0">Personal Blog</h3>
      <p class="text-muted small">Nền tảng chia sẻ kiến thức công nghệ</p>
      <div class="demo-badge">Tài khoản demo: <strong>steven.bui</strong> / <strong>123</strong></div>
    </div>

    <form onsubmit="event.preventDefault(); login();">
      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Tên đăng nhập</label>
        <input id="username" type="text" class="form-control form-control-lg fs-6" placeholder="Nhập username" required value="steven.bui">
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium text-secondary">Mật khẩu</label>
        <input id="password" type="password" class="form-control form-control-lg fs-6" placeholder="Nhập password" required value="123">
      </div>

      <button id="btnLogin" type="submit" class="btn btn-primary w-100 mt-2">
        Đăng nhập
      </button>

      <div class="d-flex align-items-center my-3">
        <hr class="flex-grow-1 m-0 opacity-25">
        <span class="px-2 text-muted small" style="font-size: 0.75rem;">HOẶC DÀNH CHO NHÀ TUYỂN DỤNG</span>
        <hr class="flex-grow-1 m-0 opacity-25">
      </div>

      <button type="button" class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2 fw-semibold" onclick="quickDemoLogin('steven.bui', '123')">
        <span>⚡</span> Đăng nhập nhanh (Tài khoản Demo)
      </button>
    </form>

    <div id="error_mes" class="text-danger text-center mt-3 small fw-medium"></div>

    <div class="text-center mt-4 pt-3 border-top">
      <span class="text-muted small">Chưa có tài khoản?</span> 
      <a href="/user/register.html" class="fw-semibold text-decoration-none text-primary small">Đăng ký ngay</a>
    </div>

  </div>
</div>

<script>
  function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("btnLogin");
    const errorDiv = document.getElementById("error_mes");

    if (!username || !password) {
      errorDiv.innerText = "Vui lòng nhập đầy đủ tài khoản và mật khẩu.";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';
    errorDiv.innerText = "";

    axios.post("/api/users/login", { username, password })
      .then(res => {
        if (res.data && res.data.id) {
          localStorage.setItem("user", JSON.stringify(res.data));
          window.location.href = "/blog/home.html";
        } else {
          errorDiv.innerText = "Đăng nhập thất bại: Tài khoản hoặc mật khẩu không chính xác!";
          btn.disabled = false;
          btn.innerText = "Đăng nhập";
        }
      })
      .catch(err => {
        console.error("Lỗi đăng nhập:", err);
        errorDiv.innerText = "Đăng nhập thất bại: Sai tài khoản/mật khẩu hoặc lỗi kết nối máy chủ!";
        btn.disabled = false;
        btn.innerText = "Đăng nhập";
      });
  }

  function quickDemoLogin(u, p) {
    document.getElementById("username").value = u;
    document.getElementById("password").value = p;
    login();
  }
</script>

</body>
</html>
